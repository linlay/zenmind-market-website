services:
  market-website:
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-}
        BRAND: ${BRAND:-zenmind}
    image: zenmind-market-website
    container_name: zenmind-market-website
    ports:
      - "${WEBSITE_PORT:-127.0.0.1:11964}:80"
    networks:
      zenmind-official-net:
        aliases:
          - zenmind-market-website
    restart: unless-stopped

networks:
  zenmind-official-net:
    external: true
